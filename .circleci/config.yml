# CircleCI — lint/typecheck + Vercel deploy (debug pull)
version: 2.1

orbs:
  node: circleci/node@7

jobs:
  ci:
    docker:
      - image: cimg/node:20.19
    steps:
      - checkout
      - node/install-packages:
          pkg-manager: npm
      - run:
          name: Lint
          command: npm run lint
      - run:
          name: Typecheck
          command: npm run typecheck

  deploy:
    docker:
      - image: cimg/node:20.19
    # VERCEL_* come from Project Settings env vars — do not redeclare here
    # (job-level environment: VERCEL_*: $VERCEL_* was passed literally unexpanded)
    steps:
      - checkout
      - run:
          name: Verify Vercel env vars are set
          command: |
            if [ -z "$VERCEL_TOKEN" ]; then echo "VERCEL_TOKEN is EMPTY"; else echo "VERCEL_TOKEN is set (length: ${#VERCEL_TOKEN})"; fi
            if [ -z "$VERCEL_ORG_ID" ]; then echo "VERCEL_ORG_ID is EMPTY"; else echo "VERCEL_ORG_ID is set: $VERCEL_ORG_ID"; fi
            if [ -z "$VERCEL_PROJECT_ID" ]; then echo "VERCEL_PROJECT_ID is EMPTY"; else echo "VERCEL_PROJECT_ID is set: $VERCEL_PROJECT_ID"; fi
      - run:
          name: Install Vercel CLI
          command: npm install --global vercel@latest && vercel --version
      - run:
          name: Pull Vercel environment
          command: |
            if [ "$CIRCLE_BRANCH" = "main" ] && [ -z "${CIRCLE_PULL_REQUEST:-}" ]; then
              vercel pull --yes --environment=production --token="$VERCEL_TOKEN" --debug
            else
              vercel pull --yes --environment=preview --token="$VERCEL_TOKEN" --debug
            fi
      - run:
          name: Verify Auth0 env keys after vercel pull
          command: |
            # vercel pull writes .vercel/.env.*.local — print presence/length only
            ENV_FILE=""
            if [ -f .vercel/.env.production.local ]; then ENV_FILE=.vercel/.env.production.local; fi
            if [ -f .vercel/.env.preview.local ]; then ENV_FILE=.vercel/.env.preview.local; fi
            echo "env file: ${ENV_FILE:-NONE}"
            for KEY in AUTH0_DOMAIN APP_BASE_URL AUTH0_CLIENT_ID AUTH0_SECRET AUTH0_AUDIENCE; do
              if [ -z "$ENV_FILE" ]; then
                echo "$KEY: no env file from pull"
                continue
              fi
              LINE=$(grep -E "^${KEY}=" "$ENV_FILE" || true)
              if [ -z "$LINE" ]; then
                echo "$KEY: MISSING from pulled env"
              else
                VAL="${LINE#*=}"
                VAL="${VAL%\"}"; VAL="${VAL#\"}"
                echo "$KEY: present length=${#VAL}"
              fi
            done
      - run:
          name: Build project artifacts
          command: |
            if [ "$CIRCLE_BRANCH" = "main" ] && [ -z "${CIRCLE_PULL_REQUEST:-}" ]; then
              vercel build --prod --token="$VERCEL_TOKEN"
            else
              vercel build --token="$VERCEL_TOKEN"
            fi
      - run:
          name: Deploy to Vercel
          command: |
            if [ "$CIRCLE_BRANCH" = "main" ] && [ -z "${CIRCLE_PULL_REQUEST:-}" ]; then
              url=$(vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN")
              echo "Production deployment: $url"
            else
              url=$(vercel deploy --prebuilt --token="$VERCEL_TOKEN")
              echo "Preview deployment: $url"
            fi

workflows:
  ci-cd:
    jobs:
      - ci
      - deploy:
          requires:
            - ci
