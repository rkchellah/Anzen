# CircleCI — lint/typecheck + Vercel deploy (replaces GitHub Actions)
version: 2.1

orbs:
  node: circleci/node@7

jobs:
  ci:
    docker:
      - image: cimg/node:20.19
    steps:
      - checkout
      - node/install-packages:
          pkg-manager: npm
      - run:
          name: Lint
          command: npm run lint
      - run:
          name: Typecheck
          command: npm run typecheck

  deploy:
    docker:
      - image: cimg/node:20.19
    # VERCEL_* come from Project Settings → Environment Variables
    steps:
      - checkout
      - run:
          name: Require Vercel credentials
          command: |
            if [ -z "$VERCEL_TOKEN" ] || [ -z "$VERCEL_ORG_ID" ] || [ -z "$VERCEL_PROJECT_ID" ]; then
              echo "Missing VERCEL_TOKEN, VERCEL_ORG_ID, or VERCEL_PROJECT_ID"
              echo "Set them in CircleCI → Project Settings → Environment Variables"
              exit 1
            fi
      - run:
          name: Install Vercel CLI
          command: npm install --global vercel@latest
      - run:
          name: Pull Vercel environment
          command: |
            if [ "$CIRCLE_BRANCH" = "main" ] && [ -z "$CIRCLE_PULL_REQUEST" ]; then
              vercel pull --yes --environment=production --token="$VERCEL_TOKEN"
            else
              vercel pull --yes --environment=preview --token="$VERCEL_TOKEN"
            fi
      - run:
          name: Build project artifacts
          command: |
            if [ "$CIRCLE_BRANCH" = "main" ] && [ -z "$CIRCLE_PULL_REQUEST" ]; then
              vercel build --prod --token="$VERCEL_TOKEN"
            else
              vercel build --token="$VERCEL_TOKEN"
            fi
      - run:
          name: Deploy to Vercel
          command: |
            if [ "$CIRCLE_BRANCH" = "main" ] && [ -z "$CIRCLE_PULL_REQUEST" ]; then
              url=$(vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN")
              echo "Production deployment: $url"
            else
              url=$(vercel deploy --prebuilt --token="$VERCEL_TOKEN")
              echo "Preview deployment: $url"
            fi
            echo "$url" > /tmp/deploy-url.txt
      - store_artifacts:
          path: /tmp/deploy-url.txt
          destination: deploy-url.txt

workflows:
  ci-cd:
    jobs:
      - ci
      - deploy:
          requires:
            - ci
