# CircleCI — lint/typecheck + Vercel deploy (debug pull)
version: 2.1

orbs:
  node: circleci/node@7

jobs:
  ci:
    docker:
      - image: cimg/node:20.19
    steps:
      - checkout
      - node/install-packages:
          pkg-manager: npm
      - run:
          name: Lint
          command: npm run lint
      - run:
          name: Typecheck
          command: npm run typecheck

  deploy:
    docker:
      - image: cimg/node:20.19
    # VERCEL_* come from Project Settings env vars — do not redeclare here
    # (job-level environment: VERCEL_*: $VERCEL_* was passed literally unexpanded)
    steps:
      - checkout
      - run:
          name: Verify Vercel env vars are set
          command: |
            if [ -z "$VERCEL_TOKEN" ]; then echo "VERCEL_TOKEN is EMPTY"; else echo "VERCEL_TOKEN is set (length: ${#VERCEL_TOKEN})"; fi
            if [ -z "$VERCEL_ORG_ID" ]; then echo "VERCEL_ORG_ID is EMPTY"; else echo "VERCEL_ORG_ID is set: $VERCEL_ORG_ID"; fi
            if [ -z "$VERCEL_PROJECT_ID" ]; then echo "VERCEL_PROJECT_ID is EMPTY"; else echo "VERCEL_PROJECT_ID is set: $VERCEL_PROJECT_ID"; fi
      - run:
          name: Install Vercel CLI
          command: npm install --global vercel@latest && vercel --version
      - run:
          name: Pull Vercel environment
          command: |
            if [ "$CIRCLE_BRANCH" = "main" ] && [ -z "${CIRCLE_PULL_REQUEST:-}" ]; then
              vercel pull --yes --environment=production --token="$VERCEL_TOKEN" --debug
            else
              vercel pull --yes --environment=preview --token="$VERCEL_TOKEN" --debug
            fi
      - run:
          name: Verify Auth0 env keys after vercel pull
          command: |
            ENV_FILE=""
            if [ -f .vercel/.env.production.local ]; then
              ENV_FILE=.vercel/.env.production.local
            elif [ -f .vercel/.env.preview.local ]; then
              ENV_FILE=.vercel/.env.preview.local
            fi
            echo "env file: ${ENV_FILE:-NONE}"
            if [ -z "$ENV_FILE" ]; then
              echo "No .vercel/.env.*.local from vercel pull"
              exit 1
            fi
            # Use key=value split that keeps '=' inside values (secrets often contain '=')
            while IFS= read -r line || [ -n "$line" ]; do
              case "$line" in
                ''|\#*) continue ;;
              esac
              key="${line%%=*}"
              value="${line#*=}"
              # strip CR, surrounding double/single quotes
              value="${value%$'\r'}"
              case "$value" in
                \"*\") value="${value#\"}"; value="${value%\"}" ;;
                \'*\') value="${value#\'}"; value="${value%\'}" ;;
              esac
              case "$key" in
                AUTH0_DOMAIN|APP_BASE_URL|AUTH0_CLIENT_ID|AUTH0_SECRET|AUTH0_AUDIENCE)
                  echo "$key: present, length=${#value}"
                  ;;
              esac
            done < "$ENV_FILE"
            # First character only — format check without exposing secrets
            get_val() {
              local k="$1" line key value
              while IFS= read -r line || [ -n "$line" ]; do
                key="${line%%=*}"
                [ "$key" = "$k" ] || continue
                value="${line#*=}"
                value="${value%$'\r'}"
                case "$value" in
                  \"*\") value="${value#\"}"; value="${value%\"}" ;;
                  \'*\') value="${value#\'}"; value="${value%\'}" ;;
                esac
                printf '%s' "$value"
                return 0
              done < "$ENV_FILE"
              return 1
            }
            D=$(get_val AUTH0_DOMAIN || true)
            B=$(get_val APP_BASE_URL || true)
            if [ -n "$D" ]; then echo "AUTH0_DOMAIN first_char=${D:0:1}"; else echo "AUTH0_DOMAIN first_char: MISSING"; fi
            if [ -n "$B" ]; then echo "APP_BASE_URL first_char=${B:0:1}"; else echo "APP_BASE_URL first_char: MISSING"; fi
      - run:
          name: Build project artifacts
          command: |
            if [ "$CIRCLE_BRANCH" = "main" ] && [ -z "${CIRCLE_PULL_REQUEST:-}" ]; then
              vercel build --prod --token="$VERCEL_TOKEN"
            else
              vercel build --token="$VERCEL_TOKEN"
            fi
      - run:
          name: Deploy to Vercel
          command: |
            if [ "$CIRCLE_BRANCH" = "main" ] && [ -z "${CIRCLE_PULL_REQUEST:-}" ]; then
              url=$(vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN")
              echo "Production deployment: $url"
            else
              url=$(vercel deploy --prebuilt --token="$VERCEL_TOKEN")
              echo "Preview deployment: $url"
            fi

workflows:
  ci-cd:
    jobs:
      - ci
      - deploy:
          requires:
            - ci
