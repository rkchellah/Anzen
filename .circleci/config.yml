# CircleCI — lint + typecheck only.
# Vercel deploys from the GitHub connection (production on main, preview otherwise).
version: 2.1

orbs:
  node: circleci/node@7

jobs:
  ci:
    docker:
      - image: cimg/node:20.19
    steps:
      - checkout
      - node/install-packages:
          pkg-manager: npm
      - run:
          name: Lint
          command: npm run lint
      - run:
          name: Typecheck
          command: npm run typecheck

workflows:
  ci-cd:
    jobs:
      - ci
