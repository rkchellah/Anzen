# CircleCI — lint + typecheck
# Production/preview deploys: Vercel Git integration (not CLI)
version: 2.1

orbs:
  node: circleci/node@7

jobs:
  ci:
    docker:
      - image: cimg/node:20.19
    steps:
      - checkout
      - node/install-packages:
          pkg-manager: npm
      - run:
          name: Lint
          command: npm run lint
      - run:
          name: Typecheck
          command: npm run typecheck

workflows:
  ci:
    jobs:
      - ci
